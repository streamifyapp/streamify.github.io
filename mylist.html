        /* ══════════════════════════════════════
           BOTTOM NAVIGATION BAR
        ══════════════════════════════════════ */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 9000;
            height: 70px;
            display: flex; align-items: stretch;
            background: rgba(10, 10, 15, 0.82);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 -4px 30px rgba(0,0,0,0.6), 0 -1px 0 rgba(229,9,20,0.15) inset;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }
        .bottom-nav::before {
            content: '';
            position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(229,9,20,0.5) 30%, rgba(255,107,107,0.6) 50%, rgba(229,9,20,0.5) 70%, transparent);
            filter: blur(0.5px);
        }
        .bottom-nav-item {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 5px;
            text-decoration: none; color: rgba(255,255,255,0.45);
            font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
            cursor: pointer; background: none; border: none; padding: 0;
            transition: color 0.25s ease; position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .bottom-nav-item:hover  { color: rgba(255,255,255,0.75); }
        .bottom-nav-item.active { color: #fff; }
        .bnav-icon-wrap {
            position: relative; width: 44px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; transition: background 0.3s ease, transform 0.2s ease;
        }
        .bottom-nav-item.active .bnav-icon-wrap {
            background: rgba(229,9,20,0.18); transform: translateY(-1px);
        }
        .bottom-nav-item:active .bnav-icon-wrap { transform: scale(0.88) translateY(-1px); }
        .bnav-icon-wrap i {
            font-size: 18px;
            transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), color 0.25s ease;
        }
        .bottom-nav-item.active .bnav-icon-wrap i {
            color: #e50914;
            filter: drop-shadow(0 0 8px rgba(229,9,20,0.7));
            transform: scale(1.15);
        }
        .bnav-label {
            font-family: 'Inter', sans-serif; font-size: 9.5px; font-weight: 700;
            letter-spacing: 0.6px; text-transform: uppercase;
            transition: color 0.25s ease, opacity 0.25s ease; opacity: 0.7;
        }
        .bottom-nav-item.active .bnav-label { opacity: 1; color: #fff; }
        .bnav-dot {
            position: absolute; top: -8px; left: 50%;
            transform: translateX(-50%) scaleX(0);
            width: 20px; height: 3px; border-radius: 0 0 3px 3px;
            background: linear-gradient(90deg, #e50914, #ff6b6b);
            box-shadow: 0 2px 8px rgba(229,9,20,0.6);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        .bottom-nav-item.active .bnav-dot { transform: translateX(-50%) scaleX(1); }
        .bnav-avatar {
            width: 26px; height: 26px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
            transition: border-color 0.25s ease, transform 0.25s ease;
        }
        .bottom-nav-item.active .bnav-avatar {
            border-color: #e50914; box-shadow: 0 0 10px rgba(229,9,20,0.5);
            transform: scale(1.08) translateY(-1px);
        }
        .bnav-ripple {
            position: absolute; border-radius: 50%;
            background: rgba(229,9,20,0.25); transform: scale(0);
            animation: bnavRipple 0.5s ease-out forwards; pointer-events: none;
        }
        @keyframes bnavRipple { to { transform: scale(3.5); opacity: 0; } }
    </style>

    <!-- ═══ BOTTOM NAV SCRIPT ═══ -->
    <script>
    (function () {
        var nav = document.getElementById('bottomNav');

        /* Always visible on load */
        nav.style.transform = 'translateY(0)';

        /* Ripple on tap */
        document.querySelectorAll('.bottom-nav-item').forEach(function (item) {
            item.addEventListener('click', function (e) {
                var wrap = item.querySelector('.bnav-icon-wrap');
                if (!wrap) return;
                var rip  = document.createElement('span');
                rip.className = 'bnav-ripple';
                var rect = wrap.getBoundingClientRect();
                var size = Math.max(rect.width, rect.height);
                rip.style.cssText = [
                    'width:' + size + 'px',
                    'height:' + size + 'px',
                    'top:' + (e.clientY - rect.top - size / 2) + 'px',
                    'left:' + (e.clientX - rect.left - size / 2) + 'px'
                ].join(';');
                wrap.style.position = 'relative';
                wrap.style.overflow = 'hidden';
                wrap.appendChild(rip);
                rip.addEventListener('animationend', function () { rip.remove(); });
            });
        });

        /* Scroll-aware hide/show — delayed so page-load events don't fire it */
        var lastScroll    = window.pageYOffset;
        var scrollEnabled = false;
        setTimeout(function () {
            lastScroll    = window.pageYOffset;
            scrollEnabled = true;
        }, 600);

        window.addEventListener('scroll', function () {
            if (!scrollEnabled) return;
            var cur = window.pageYOffset;
            if (cur <= 80) { nav.style.transform = 'translateY(0)'; lastScroll = cur; return; }
            if (cur > lastScroll + 6)      nav.style.transform = 'translateY(110%)';
            else if (cur < lastScroll - 6) nav.style.transform = 'translateY(0)';
            lastScroll = cur;
        }, { passive: true });
    })();
    </script>
