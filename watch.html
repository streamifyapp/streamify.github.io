<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Streamify</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GTEG9YQHV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-3GTEG9YQHV');
    </script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/watch.css">
    <link rel="stylesheet" href="css/ads.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="watch-body">
    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back to Home</span>
    </a>

    <!-- Player -->
    <div class="player-container">
        <div class="player-loader" id="playerLoader">
            <div class="spinner"></div>
            <p>Loading Player...</p>
        </div>
        <iframe id="player" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- Server Selector -->
    <div class="server-selector">
        <h3><i class="fas fa-server"></i> Select Server</h3>
        <p class="server-hint">If current server doesn't work, try another one</p>
        <div class="server-buttons" id="serverButtons">
            <!-- Servers will be added dynamically -->
        </div>
    </div>

    <!-- Content -->
    <div class="watch-main">
        
        <!-- Title & Meta -->
        <div class="watch-header">
            <h1 id="watchTitle">Loading...</h1>
            <div class="watch-meta">
                <span class="meta-rating"><i class="fas fa-star"></i> <span id="watchRating">8.5</span></span>
                <span id="watchYear">2024</span>
                <span id="watchDuration">2h 15m</span>
                <span class="meta-badge">HD</span>
            </div>
        </div>

        <!-- Episode Selector (TV Shows) -->
        <div class="episode-selector" id="episodeSelector" style="display:none;">
            <div class="selector-header">
                <h2><i class="fas fa-list"></i> Episodes</h2>
                <select id="seasonSelect"></select>
            </div>
            <div class="episodes-grid" id="episodesGrid"></div>
        </div>

        <!-- Description -->
        <div class="watch-desc">
            <p id="watchDesc">Loading description...</p>
            <div class="watch-info">
                <p><strong>Genres:</strong> <span id="watchGenres">-</span></p>
                <p><strong>Cast:</strong> <span id="watchCast">-</span></p>
            </div>
        </div>

        <!-- Actions -->
        <div class="watch-actions">
            <button class="action-btn" id="listBtn">
                <i class="fas fa-plus"></i>
                <span>My List</span>
            </button>
            <button class="action-btn" id="shareBtn">
                <i class="fas fa-share"></i>
                <span>Share</span>
            </button>
            <button class="action-btn" id="likeBtn">
                <i class="fas fa-thumbs-up"></i>
                <span>Like</span>
            </button>
        </div>

        <!-- Similar -->
        <div class="similar-section">
            <h2><i class="fas fa-film"></i> More Like This</h2>
            <div class="similar-grid" id="similarGrid"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/watch.js"></script>
</body>
</html>
