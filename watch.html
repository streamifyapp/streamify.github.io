<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch - Streamify</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/watch.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="watch-page">

    <!-- Back Button -->
    <a href="index.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        <span>Back</span>
    </a>

    <!-- Player -->
    <div class="player-wrapper">
        <div class="player-loading" id="playerLoading">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
        <iframe id="videoPlayer" allowfullscreen></iframe>
    </div>

    <!-- Content Info -->
    <div class="watch-content">
        <div class="content-header">
            <h1 id="contentTitle">Loading...</h1>
            <div class="content-meta">
                <span class="meta-rating" id="contentRating">⭐ 8.5</span>
                <span id="contentYear">2024</span>
                <span id="contentDuration">2h 15m</span>
                <span class="meta-badge">HD</span>
            </div>
        </div>

        <!-- Season/Episode Selector (Shows for TV only) -->
        <div class="episodes-selector" id="episodesSelector" style="display:none;">
            <div class="selector-row">
                <select id="seasonSelect"></select>
                <select id="episodeSelect"></select>
                <button class="play-episode-btn" id="playEpisodeBtn">
                    <i class="fas fa-play"></i> Play Episode
                </button>
            </div>
        </div>

        <p class="content-description" id="contentDescription">Loading description...</p>
        
        <div class="content-details">
            <p><strong>Genres:</strong> <span id="contentGenres">-</span></p>
            <p><strong>Cast:</strong> <span id="contentCast">-</span></p>
        </div>

        <div class="content-actions">
            <button class="action-btn" id="addListBtn">
                <i class="fas fa-plus"></i> My List
            </button>
            <button class="action-btn" id="shareBtn">
                <i class="fas fa-share"></i> Share
            </button>
        </div>

        <!-- Similar Content -->
        <div class="similar-section">
            <h2>More Like This</h2>
            <div class="similar-grid" id="similarGrid"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/watch.js"></script>
</body>
</html>
