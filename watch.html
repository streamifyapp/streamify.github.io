   <!-- Popunder Ad - 2 Minute Cooldown -->
<script>
(function() {
    var COOLDOWN = 2 * 60 * 1000;
    var now = Date.now();
    var lastPop = parseInt(localStorage.getItem('popunder_time') || '0');
    
    if (now - lastPop > COOLDOWN) {
        localStorage.setItem('popunder_time', now.toString());
        
        setTimeout(function() {
            var s = document.createElement('script');
            s.src = 'https://pl28663508.effectivegatecpm.com/83/da/42/83da42654c8f32e05cc7eccf2cb42329.js';
            document.head.appendChild(s);
        }, 2000);
    }
})();
</script>
